name: mssql_io
description: "Flutter plugin for Microsoft SQL Server using FFI and FreeTDS. Cross-platform support."
version: 0.0.6
homepage: https://farhansadikgalib.com/
repository: https://github.com/farhansadikgalib/mssql_io
issue_tracker: https://github.com/farhansadikgalib/mssql_io/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  flutter_web_plugins:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: MssqlIoWeb
        fileName: mssql_io_web.dart

